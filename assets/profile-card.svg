<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="600" viewBox="0 0 1000 600" role="img" aria-labelledby="title description">
  <title id="title">Omja's developer ID card</title>
  <desc id="description">A pink and lilac developer ID card with an illustrated portrait inspired by Omja: long dark wavy hair, a warm smile, and a black top. Omja Ujesha Jetshree, full-stack developer building AI, voice, and real-time apps.</desc>
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#e5daef" stroke-width="1"/>
    </pattern>
    <clipPath id="portrait"><rect x="0" y="0" width="260" height="310" rx="9"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="9" stdDeviation="0" flood-color="#d7c5e2"/>
    </filter>
  </defs>

  <rect width="1000" height="600" rx="28" fill="#f5effa"/>
  <rect width="1000" height="600" rx="28" fill="url(#grid)"/>

  <!-- The lanyard and slot make this a little keepsake, not a dashboard. -->
  <path d="M448 0L478 75H521L554 0" fill="#c2b0dc" stroke="#735987" stroke-width="3"/>
  <path d="M474 0L495 59H506L528 0" fill="#f5effa"/>
  <rect x="53" y="62" width="894" height="480" rx="32" fill="#fffafd" stroke="#715a7c" stroke-width="3" filter="url(#shadow)"/>
  <path d="M86 63H914Q946 63 946 95V157H54V95Q54 63 86 63Z" fill="#f4d5e2"/>
  <path d="M55 157H945" stroke="#715a7c" stroke-width="2"/>
  <rect x="458" y="83" width="84" height="15" rx="7.5" fill="#715a7c"/>
  <rect x="469" y="86" width="62" height="5" rx="2.5" fill="#473951"/>
  <g fill="#55415f" font-family="'Trebuchet MS', Arial, sans-serif">
    <text x="88" y="131" font-size="20" font-weight="700" letter-spacing="3">THE DEVELOPER CLUB</text>
    <text x="910" y="131" font-size="18" text-anchor="end" letter-spacing="2">MEMBER / OMJA</text>
  </g>

  <!-- Hand-drawn portrait; no embedded photograph or external image requests. -->
  <g transform="translate(88 183) rotate(-3 140 165)">
    <rect x="-7" y="-7" width="274" height="324" rx="12" fill="#fff" stroke="#cdbcd5" stroke-width="2"/>
    <g clip-path="url(#portrait)">
      <rect width="260" height="310" fill="#f5e3ef"/>
      <circle cx="130" cy="137" r="109" fill="#fff6ed"/>
      <ellipse cx="132" cy="285" rx="90" ry="10" fill="#deccdf"/>
      <!-- Oversized head and a small bust give the portrait a sticker silhouette. -->
      <path d="M35 139C13 80 43 22 95 24C118 9 169 14 194 39C230 61 230 103 221 139C216 162 237 175 225 199C215 219 236 237 220 257C201 278 62 282 41 260C19 238 44 222 32 202C17 177 42 164 35 139Z" fill="#342d3b" stroke="#fff" stroke-width="12" stroke-linejoin="round"/>
      <path d="M35 139C13 80 43 22 95 24C118 9 169 14 194 39C230 61 230 103 221 139C216 162 237 175 225 199C215 219 236 237 220 257C201 278 62 282 41 260C19 238 44 222 32 202C17 177 42 164 35 139Z" fill="#342d3b" stroke="#514054" stroke-width="2.5"/>
      <path d="M73 281V251Q76 225 108 223H153Q185 225 189 251V281Z" fill="#ffe2d1" stroke="#d5a998" stroke-width="2"/>
      <path d="M115 199V226Q130 240 146 226V199" fill="#f8d4c1" stroke="#d5a998" stroke-width="2"/>
      <path d="M84 245L91 236Q130 256 171 236L180 245L187 281H76Z" fill="#33313f"/>
      <path d="M93 232V248M168 232V248" stroke="#33313f" stroke-width="7" stroke-linecap="round"/>
      <ellipse cx="53" cy="139" rx="12" ry="17" fill="#ffe2d1" stroke="#d5a998" stroke-width="2"/>
      <ellipse cx="207" cy="139" rx="12" ry="17" fill="#ffe2d1" stroke="#d5a998" stroke-width="2"/>
      <path d="M53 115C53 72 87 44 130 44C174 44 208 74 208 115L207 149C206 186 171 212 130 212C89 212 54 186 53 149Z" fill="#ffe2d1" stroke="#d5a998" stroke-width="2"/>
      <!-- Side-swept, center-parted hair keeps a link to the reference photo. -->
      <path d="M46 131C28 75 58 25 103 26Q124 21 134 33C115 46 101 63 89 77C77 91 62 97 55 131Z" fill="#342d3b"/>
      <path d="M132 33C163 22 207 44 215 86Q220 112 207 139C204 104 182 92 166 72Q150 47 132 33Z" fill="#342d3b"/>
      <g fill="none" stroke="#665268" stroke-width="3" stroke-linecap="round">
        <path d="M112 36Q65 42 50 91M151 37Q194 48 204 85"/>
        <path d="M47 157C66 188 32 200 49 222C63 241 44 248 58 259"/>
        <path d="M211 158C193 186 229 202 213 223C198 244 218 247 204 259"/>
      </g>
      <g fill="none" stroke="#68505c" stroke-width="2.8" stroke-linecap="round">
        <path d="M77 116Q88 109 101 114M159 114Q173 109 184 116"/>
      </g>
      <g fill="#463440">
        <ellipse cx="91" cy="139" rx="10" ry="13"/>
        <ellipse cx="170" cy="139" rx="10" ry="13"/>
      </g>
      <g fill="none" stroke="#463440" stroke-width="2.8" stroke-linecap="round">
        <path d="M83 131L79 127M178 131L182 127"/>
      </g>
      <g fill="#fffafd">
        <ellipse cx="94" cy="134" rx="3.7" ry="4"/>
        <ellipse cx="173" cy="134" rx="3.7" ry="4"/>
        <circle cx="88" cy="144" r="1.8"/>
        <circle cx="167" cy="144" r="1.8"/>
      </g>
      <ellipse cx="76" cy="160" rx="16" ry="9" fill="#f4b1bd" opacity=".75"/>
      <ellipse cx="185" cy="160" rx="16" ry="9" fill="#f4b1bd" opacity=".75"/>
      <path d="M130 149Q125 155 132 156" fill="none" stroke="#d5a998" stroke-width="2" stroke-linecap="round"/>
      <path d="M119 173Q130 186 142 173" fill="#e89aa9" stroke="#a56980" stroke-width="2.3" stroke-linecap="round"/>
      <g stroke="#de91aa" stroke-width="1.6" stroke-linecap="round">
        <path d="M69 159L68 163M76 159L75 163M183 159L182 163M190 159L189 163"/>
      </g>
      <!-- A tiny ribbon hair clip is the portrait's one playful accessory. -->
      <g transform="translate(196 68) rotate(22)" stroke="#af7194" stroke-width="2" stroke-linejoin="round">
        <path d="M0 0C-26-21-30-4-21 9Q-13 15 0 0C14-24 29-19 24-3Q20 12 0 0Z" fill="#edb3d2"/>
        <ellipse rx="5" ry="6" fill="#f6cce1"/>
      </g>
      <g fill="#fffafd" stroke="#c5a0c4" stroke-width="1.5" stroke-linejoin="round">
        <path d="M24 87L27 96L36 99L27 102L24 111L21 102L12 99L21 96Z"/>
        <path d="M231 213L234 220L241 223L234 226L231 233L228 226L221 223L228 220Z"/>
      </g>
      <path d="M24 240C12 229 14 219 22 222Q26 222 28 227Q36 217 41 225C46 232 34 239 24 245Z" fill="#eeb6ce"/>
    </g>
  </g>

  <g font-family="'Trebuchet MS', Arial, sans-serif" fill="#55415f">
    <text x="397" y="209" font-size="17" letter-spacing="3" fill="#876a93">HELLO, WORLD. I'M</text>
    <text x="393" y="274" font-size="65" font-weight="700">omja<tspan fill="#be718e">.</tspan></text>
    <text x="397" y="309" font-size="23">Omja Ujesha Jetshree</text>
    <rect x="397" y="331" width="258" height="37" rx="18.5" fill="#e8def3"/>
    <text x="526" y="356" text-anchor="middle" font-size="19" font-weight="700">full-stack developer</text>
    <text x="397" y="406" font-size="23">AI-powered apps.</text>
    <text x="397" y="438" font-size="23">Voice, chat &amp; real-time things.</text>
    <path d="M397 461H902" stroke="#ddcddd" stroke-width="2" stroke-dasharray="5 7"/>
    <text x="397" y="497" font-size="18" fill="#80618b">MERN + Python</text>
    <text x="901" y="497" text-anchor="end" font-size="18" fill="#80618b">@sharmaomja</text>
  </g>

  <!-- A small flower sticker, rather than a wall of decorative badges. -->
  <g transform="translate(860 242) rotate(13)" stroke="#a77590" stroke-width="2">
    <path d="M0-12C-23-39-39-9-19 3C-43 20-17 42-4 22C6 48 34 30 21 11C48 4 33-27 13-17C12-36-6-35 0-12Z" fill="#f1c5d8"/>
    <circle cx="3" cy="5" r="10" fill="#f5df9e"/>
  </g>
  <text x="500" y="582" text-anchor="middle" font-family="'Trebuchet MS', Arial, sans-serif" font-size="17" fill="#80618b">a small corner of the internet, made mine.</text>
</svg>
