      <path d="M107 180L104 229Q130 252 159 229L155 180" fill="#e5b79b" stroke="#ca977e" stroke-width="2"/>
      <path d="M49 260L80 241Q129 261 182 241L216 264L228 321H36Z" fill="#272832"/>
      <path d="M86 232L81 257M179 232L184 257" stroke="#272832" stroke-width="10" stroke-linecap="round"/>
      <ellipse cx="70" cy="128" rx="12" ry="19" fill="#edc2a8"/>
      <ellipse cx="190" cy="128" rx="12" ry="19" fill="#edc2a8"/>
      <path d="M73 94Q75 48 129 43Q183 46 189 95L188 149C188 184 161 205 132 205C101 205 75 184 72 151Z" fill="#f0c9b0" stroke="#d0a08a" stroke-width="2"/>
