        <path d="M89 122L86 119M173 122L176 119" stroke-width="2"/>
      </g>
      <ellipse cx="102" cy="125" rx="6.2" ry="7.5" fill="#453239"/>
      <ellipse cx="162" cy="125" rx="6.2" ry="7.5" fill="#453239"/>
      <circle cx="104" cy="122" r="2.2" fill="#fffafd"/>
      <circle cx="164" cy="122" r="2.2" fill="#fffafd"/>
      <circle cx="100" cy="128" r="1" fill="#f0c9b0"/>
      <circle cx="160" cy="128" r="1" fill="#f0c9b0"/>
      <path d="M132 135L129 145Q133 149 138 145" fill="none" stroke="#ca977e" stroke-width="2" stroke-linecap="round"/>
      <ellipse cx="92" cy="149" rx="15" ry="9" fill="#e9a0a7" opacity=".52"/>
      <ellipse cx="171" cy="149" rx="15" ry="9" fill="#e9a0a7" opacity=".52"/>
      <path d="M114 166Q132 175 151 165Q134 187 118 174Z" fill="#ce8493"/>
      <path d="M114 166Q132 175 151 165" fill="none" stroke="#a65f75" stroke-width="2" stroke-linecap="round"/>
